name: TradingBot

on:
  schedule:
    - cron: "*/15 * * * *"  # cada 15 minutos (GitHub puede demorarlo unos minutos más)
  workflow_dispatch: {}      # permite ejecutarlo a mano desde la pestaña Actions

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Escanear mercados
        run: python main.py scan

      - name: Guardar estado en el repo
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add -f data/
          if git diff --cached --quiet; then
            echo "Sin cambios de estado"
          else
            git commit -m "bot: escaneo $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
